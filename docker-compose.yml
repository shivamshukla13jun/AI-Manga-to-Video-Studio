
services:
  redis:
    image: redis:latest
    container_name: redis
    command: ["redis-server", "--bind", "0.0.0.0", "--requirepass", "redis123"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:preview
    environment:
      - TZ=Etc/UTC
      - FLARESOLVERR_ENABLED=true
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - BIND_IP=0.0.0.0
      - BIND_PORT=4567
      - DOWNLOAD_AS_CBZ=true
      - AUTH_PASSWORD=hello123
      - EXTENSION_STORES=["https://github.com/keiyoushi/extensions/raw/repo/index.pb"]
    volumes:
      - ./data:/home/suwayomi/.local/share/Tachidesk
    ports:
      - "4567:4567"
    restart: on-failure:3

  flaresolverr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: flaresolverr
    environment:
      - TZ=Etc/UTC
    restart: unless-stopped

  # free-gemini-api proxy (kodelyx) — story LLM backend for the ai-service.
  # Build context is the sibling clone; host port 8002 avoids the ai-service on 8001.
  gemini-api:
    build:
      context: ../free-gemini-api/free-gemini-api
      dockerfile: Dockerfile
    container_name: free-gemini-api
    restart: unless-stopped
    ports:
      - "8002:8001"
      - "9226:9226"
    environment:
      - TZ=Asia/Kolkata

volumes:
  redis_data:
  rabbitmq_data:
