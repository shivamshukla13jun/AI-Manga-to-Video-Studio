
services:
  redis:
    image: redis:latest
    container_name: redis
    command: ["redis-server", "--bind", "0.0.0.0", "--requirepass", "redis123"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:preview
    environment:
      - TZ=Etc/UTC
      - FLARESOLVERR_ENABLED=true
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - BIND_IP=0.0.0.0
      - BIND_PORT=4567
      - DOWNLOAD_AS_CBZ=true
      - AUTH_PASSWORD=hello123
      - EXTENSION_STORES=["https://github.com/keiyoushi/extensions/raw/repo/index.pb"]
    volumes:
      - ./data:/home/suwayomi/.local/share/Tachidesk
    ports:
      - "4567:4567"
    restart: on-failure:3

  flaresolverr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: flaresolverr
    environment:
      - TZ=Etc/UTC
    restart: unless-stopped

  # Local AI service (TTS + panel CV + local VLM story generation — no Ollama needed)
  # local-tts:
  #   build: ./ai-service
  #   container_name: manga-studio-local-tts
  #   profiles: ["local-ai"]
  #   ports:
  #     - "8001:8001"
  #   restart: unless-stopped
  #   volumes:
  #     - ./ai-service/voices:/app/voices

volumes:
  redis_data:
  rabbitmq_data:
